<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StockRadar v4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root {
  --ink:#f5f7fa; --ink2:#eef0f5; --ink3:#e8eaf0;
  --line:#dde1ec; --line2:#c8cedf;
  --sky:#2563eb; --sky2:#3b82f6;
  --mint:#059669; --ember:#dc2626; --gold:#d97706;
  --text:#111827; --text2:#374151; --text3:#6b7280;
  --glow:0 4px 24px rgba(37,99,235,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans TC',sans-serif;background:#f0f2f8;color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(37,99,235,0.04) 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 80% 80%,rgba(5,150,105,0.03) 0%,transparent 60%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(37,99,235,0.07) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%)}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 20px}

/* Header */
header{padding:16px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);position:sticky;top:0;z-index:200;box-shadow:0 1px 12px rgba(0,0,0,0.06)}
header .inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;background:linear-gradient(135deg,var(--sky),var(--mint));border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.5px}
.brand-name span{color:var(--sky)}
.brand-sub{font-size:11px;color:var(--text3);margin-top:1px}
.key-bar{display:flex;align-items:center;gap:8px}
.key-bar label{font-size:11px;color:var(--text3);white-space:nowrap}
.key-input{padding:7px 12px;background:#fff;border:1px solid var(--line2);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;width:200px;outline:none;transition:border-color 0.2s}
.key-input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.key-input::placeholder{color:var(--text3)}


/* Controls */
.controls{padding:16px 0 0}
.market-tabs{display:flex;gap:4px;margin-bottom:14px}
.mkt-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--text2);cursor:pointer;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;transition:all 0.2s}
.mkt-btn:hover{border-color:var(--sky);color:var(--sky)}
.mkt-btn.active{background:var(--sky);border-color:var(--sky);color:white}
.presets-section{margin-bottom:12px}
.presets-label{font-size:11px;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:7px}
.presets-grid{display:flex;flex-wrap:wrap;gap:5px}
.preset-group{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px 4px 6px;cursor:pointer;transition:all 0.2s}
.preset-group:hover{border-color:var(--sky2)}
.preset-group input[type=checkbox]{accent-color:var(--sky);cursor:pointer;width:14px;height:14px}
.preset-group span{font-size:12px;color:var(--text2);white-space:nowrap;user-select:none}
.preset-group:has(input:checked){border-color:var(--sky);background:rgba(37,99,235,0.06)}
.preset-group:has(input:checked) span{color:var(--sky)}
.fav-section{margin-top:6px;margin-bottom:12px;display:none}
.fav-section.visible{display:block}
.fav-header{font-size:12px;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fav-chips{display:flex;flex-wrap:wrap;gap:5px}
.fav-chip{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line2);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--text2);font-family:'JetBrains Mono',monospace;cursor:pointer}
.fav-chip:hover{border-color:var(--ember);color:var(--ember)}
.custom-section{margin-bottom:14px}
.custom-label{font-size:11px;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:7px}
.custom-input-row{display:flex;gap:8px;flex-wrap:wrap}
.custom-input{flex:1;padding:9px 14px;background:#fff;border:1px solid var(--line2);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;transition:border-color 0.2s;min-width:200px;max-width:500px}
.custom-input:focus{border-color:var(--sky)}
.custom-input::placeholder{color:var(--text3)}
.scan-btn{padding:9px 22px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--sky),#1d4ed8);color:white;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;transition:all 0.2s;box-shadow:0 4px 20px rgba(37,99,235,0.25)}
.scan-btn:hover{transform:translateY(-1px)}
.scan-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.progress-wrap{margin:16px 0;display:none}
.progress-bar-bg{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:7px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--mint));border-radius:2px;transition:width 0.4s;width:0%}
.progress-text{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace}



/* Results */
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:10px}
.results-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700}
.results-meta{font-size:12px;color:var(--text3)}
.sort-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.sort-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--text3);cursor:pointer;font-size:12px;font-family:inherit;transition:all 0.15s}
.sort-btn:hover{border-color:var(--sky);color:var(--sky)}
.sort-btn.active{background:rgba(37,99,235,0.08);border-color:var(--sky);color:var(--sky)}
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.filter-bar label{font-size:11px;color:var(--text3);white-space:nowrap;font-weight:500}
.filter-select{padding:4px 8px;border:1px solid var(--line2);border-radius:6px;font-size:12px;color:var(--text);background:#fff;outline:none;cursor:pointer}
.filter-range-group{display:flex;align-items:center;gap:5px}
.filter-range-group input[type=number]{width:58px;padding:4px 7px;border:1px solid var(--line2);border-radius:6px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text);background:#fff;outline:none}
.filter-sep{font-size:11px;color:var(--text3)}
.fav-only-btn{padding:4px 10px;border:1px solid var(--line2);border-radius:6px;font-size:12px;color:var(--text3);background:#fff;cursor:pointer;transition:all 0.15s}
.fav-only-btn.active{background:rgba(220,38,38,0.08);border-color:var(--ember);color:var(--ember)}
.filter-count{font-size:11px;color:var(--text3);margin-left:auto;white-space:nowrap}

/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
@media(max-width:780px){.cards-grid{grid-template-columns:1fr}}
.stock-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;animation:fadeUp 0.4s ease both}
.stock-card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--glow)}
.stock-card.fav-card{border-color:rgba(220,38,38,0.3)}
.stock-card.entry-ready{border-color:rgba(5,150,105,0.4);box-shadow:0 0 0 2px rgba(5,150,105,0.1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.card-head{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between}
.card-head-left{display:flex;align-items:flex-start;gap:8px;flex:1}
.fav-btn{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:0;transition:transform 0.15s;flex-shrink:0}
.fav-btn:hover{transform:scale(1.2)}
.card-symbol{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-0.3px}
.card-name{font-size:11px;color:var(--text2);margin-top:1px}
.card-price-wrap{text-align:right;flex-shrink:0}
.card-price{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600}
.card-change{font-size:11px;margin-top:1px;font-family:'JetBrains Mono',monospace}
.card-delta{font-size:10px;color:var(--text3);margin-top:1px}

/* Mini chart */
.mini-chart-wrap{padding:8px 14px 4px;border-bottom:1px solid var(--line)}
.mini-chart-wrap canvas{width:100%;height:60px;display:block}

/* Score */
.score-section{padding:10px 14px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.score-ring{position:relative;width:48px;height:48px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:800}
.score-desc{flex:1}
.score-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px}
.score-verdict{font-size:13px;font-weight:600}

/* Indicators */
.indicators{padding:8px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-bottom:1px solid var(--line)}
.ind{text-align:center}
.ind-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.ind-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.ind-sig{font-size:10px;margin-top:1px}

/* Warnings */
.warn-block{margin:0 14px 8px;display:flex;flex-direction:column;gap:4px}
.warn-item{font-size:11px;padding:6px 9px;border-radius:7px;line-height:1.5}
.warn-item.danger{background:rgba(220,38,38,0.07);border:1px solid rgba(220,38,38,0.2);color:#991b1b}
.warn-item.warn{background:rgba(217,119,6,0.07);border:1px solid rgba(217,119,6,0.2);color:#92400e}

/* Signal section */
.trade-signals{padding:10px 14px;border-bottom:1px solid var(--line)}
.trade-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;font-weight:600}
.signal-section{margin-bottom:6px}
.signal-section-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px}
.entry-ok{color:#059669;font-weight:700}
.entry-wait{color:#d97706;font-weight:700}
.signal-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.signal-box{border-radius:8px;padding:8px 10px}
.signal-box.buy{background:rgba(5,150,105,0.07);border:1px solid rgba(5,150,105,0.2)}
.signal-box.sell{background:rgba(220,38,38,0.06);border:1px solid rgba(220,38,38,0.18)}
.signal-box.stop{background:rgba(220,38,38,0.04);border:1px dashed rgba(220,38,38,0.3)}
.signal-box.target{background:rgba(5,150,105,0.04);border:1px dashed rgba(5,150,105,0.25)}
.signal-box.wait{background:rgba(107,114,128,0.07);border:1px dashed rgba(107,114,128,0.3)}
.signal-box-label{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px}
.signal-box.buy .signal-box-label,.signal-box.target .signal-box-label{color:#065f46}
.signal-box.stop .signal-box-label,.signal-box.sell .signal-box-label{color:#991b1b}
.signal-box.wait .signal-box-label{color:#374151}
.signal-price{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700}
.signal-box.buy .signal-price,.signal-box.target .signal-price{color:#059669}
.signal-box.stop .signal-price,.signal-box.sell .signal-price{color:#dc2626}
.signal-box.wait .signal-price{color:#374151;font-size:12px}
.signal-sub{font-size:9px;color:var(--text3);margin-top:2px}
.rr-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600}
.rr-good{background:rgba(5,150,105,0.1);color:#065f46}
.rr-ok{background:rgba(217,119,6,0.1);color:#92400e}
.rr-bad{background:rgba(220,38,38,0.08);color:#991b1b}

/* Backtest */
.backtest-section{padding:10px 14px;border-bottom:1px solid var(--line)}
.backtest-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.backtest-toggle{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--line2);background:#fff;color:var(--text3);cursor:pointer}
.bt-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bt-stat{text-align:center;background:var(--ink2);border-radius:7px;padding:6px 4px}
.bt-stat-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.bt-stat-lbl{font-size:9px;color:var(--text3);margin-top:1px;text-transform:uppercase}
.bt-detail{margin-top:8px;display:none}
.bt-detail.open{display:block}
.bt-trade-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3px 0;border-bottom:1px solid var(--line);color:var(--text2)}
.bt-trade-row:last-child{border-bottom:none}
.bt-win{color:var(--mint);font-weight:600}
.bt-loss{color:var(--ember);font-weight:600}

/* AI */
.ai-section{padding:12px 14px}
.ai-section-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ai-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(37,99,235,0.08);color:var(--sky);border:1px solid rgba(37,99,235,0.2);font-weight:600;letter-spacing:0.5px}
.ai-text{font-size:12px;line-height:1.75;color:var(--text2)}
.ai-text p{margin-bottom:7px}
.ai-text p:last-child{margin-bottom:0}
.ai-text strong{color:var(--text);font-weight:600}
.ai-text ul,.ai-text ol{padding-left:16px;margin-bottom:7px}
.ai-text li{margin-bottom:2px}
.ai-text h3{font-size:12px;font-weight:700;color:var(--text);margin:8px 0 3px}
.ai-loading{display:flex;align-items:center;gap:8px;color:var(--text3);font-size:12px}
.dots{display:flex;gap:4px}
.dot{width:4px;height:4px;border-radius:50%;background:var(--sky);animation:blink 1.4s infinite}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0.15}40%{opacity:1}}

.c-bull{color:#059669}.c-bear{color:#dc2626}.c-neu{color:var(--text2)}
.empty-state{text-align:center;padding:80px 20px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px}
.empty-sub{color:var(--text3);font-size:14px;line-height:1.6}
.toast{position:fixed;bottom:22px;right:22px;z-index:9999;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,0.15);transform:translateY(60px);opacity:0;transition:all 0.3s;max-width:300px}
.toast.show{transform:translateY(0);opacity:1}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.25);border-top-color:white;border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Safety rating */
.safety-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
.safety-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;font-weight:600}
.safety-stars{display:flex;gap:3px}
.safety-star{width:14px;height:14px;border-radius:3px}
.safety-tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.safety-desc{font-size:10px;color:var(--text3);flex:1;text-align:right}
.nav-tab-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--text2);cursor:pointer;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;transition:all 0.2s}
.nav-tab-btn:hover{border-color:var(--sky);color:var(--sky)}

/* Portfolio page */
.portfolio-page{display:none;padding-bottom:48px}
.portfolio-page.active{display:block}
.scan-page{display:block}
.scan-page.hidden{display:none}

.port-section{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
.port-section-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.port-section-head h3{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.port-add-form{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.port-input{padding:8px 12px;border:1px solid var(--line2);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);background:#fff;outline:none;transition:border-color 0.2s}
.port-input:focus{border-color:var(--sky)}
.port-input::placeholder{color:var(--text3)}
.port-input.sym{width:100px}
.port-input.num{width:100px}
.port-table{width:100%;border-collapse:collapse;font-size:13px}
.port-table th{padding:10px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;background:var(--ink2);border-bottom:1px solid var(--line)}
.port-table td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.port-table tr:last-child td{border-bottom:none}
.port-table tr:hover td{background:var(--ink2)}
.port-mono{font-family:'JetBrains Mono',monospace;font-size:12px}

/* Health check badge */
.health-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.health-buy{background:rgba(5,150,105,0.1);color:#065f46;border:1px solid rgba(5,150,105,0.25)}
.health-sell{background:rgba(220,38,38,0.08);color:#991b1b;border:1px solid rgba(220,38,38,0.2)}
.health-hold{background:rgba(37,99,235,0.08);color:#1e40af;border:1px solid rgba(37,99,235,0.2)}
.health-watch{background:rgba(217,119,6,0.08);color:#92400e;border:1px solid rgba(217,119,6,0.2)}

/* Decision banner */
.decision-banner{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.decision-icon{font-size:28px;flex-shrink:0}
.decision-text{flex:1}
.decision-action{font-size:18px;font-weight:800;font-family:'Syne',sans-serif;margin-bottom:2px}
.decision-reason{font-size:12px;color:var(--text2);line-height:1.5}

/* Summary cards */
.port-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.port-sum-card{background:var(--ink2);border-radius:10px;padding:12px;border:1px solid var(--line)}
.port-sum-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px}
.port-sum-val{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700}
.port-sum-sub{font-size:11px;color:var(--text3);margin-top:2px}

.loading-row{text-align:center;padding:16px;color:var(--text3);font-size:12px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.section-pad{padding:16px 0}
.mkt-badge{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:600;margin-left:5px}
.mkt-tw{background:rgba(37,99,235,0.1);color:#1e40af}
.mkt-us{background:rgba(5,150,105,0.1);color:#065f46}
.cache-badge{font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(217,119,6,0.1);color:#92400e;border:1px solid rgba(217,119,6,0.2);margin-left:4px;vertical-align:middle}
/* Portfolio card layout */

<script>
// ===== PRESETS =====
const PRESETS={
  tw:[
    {id:'tw-50',label:'台股龍頭50',syms:['2330.TW','2317.TW','2454.TW','2382.TW','2308.TW','2881.TW','2882.TW','1301.TW','1303.TW','2886.TW']},

    {id:'tw-semi',label:'半導體',syms:['2330.TW','2303.TW','2454.TW','3711.TW','2379.TW','2408.TW']},
    {id:'tw-finance',label:'金融股',syms:['2881.TW','2882.TW','2884.TW','2886.TW','2891.TW','5880.TW']},
    {id:'tw-green',label:'綠能',syms:['6869.TW','9958.TW','6806.TW','3576.TW','3691.TW']},
  ],
  us:[
    {id:'us-mag7',label:'Magnificent 7',syms:['NVDA','MSFT','AAPL','GOOGL','META','AMZN','TSLA']},
    {id:'us-ai',label:'AI 概念',syms:['NVDA','AMD','AVGO','ARM','SMCI','PLTR','CRM']},
    {id:'us-etf',label:'美股 ETF',syms:['QQQ','VOO','VT','QQQM','XLI','XLE']},
    {id:'us-semi',label:'半導體',syms:['NVDA','AMD','INTC','AVGO','LRCX','AMAT','TSM']},
    {id:'us-fin',label:'金融科技',syms:['PYPL','HOOD','V','MA','SQ','COIN']},
  ]
};
let currentMarket='all',allResults=[],displayedResults=[];
let favourites=JSON.parse(localStorage.getItem('sr_favs')||'[]');
let favOnlyMode=false;
let scanHistory=JSON.parse(localStorage.getItem('sr_history')||'{}');
const CACHE_TTL=30*60*1000;
function cacheGet(symbol){
  try{const raw=localStorage.getItem('sr_cache_'+symbol);if(!raw)return null;
  const obj=JSON.parse(raw);if(Date.now()-obj.ts>CACHE_TTL){localStorage.removeItem('sr_cache_'+symbol);return null;}return obj.data;}catch{return null;}
}
function cacheSet(symbol,data){try{localStorage.setItem('sr_cache_'+symbol,JSON.stringify({ts:Date.now(),data}));}catch{}}
function setMarket(mkt,btn){
  currentMarket=mkt;document.querySelectorAll('.mkt-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderPresets();
}
function renderPresets(){
  var grid=document.getElementById('presets-grid');var groups=[];
  if(currentMarket==='all'||currentMarket==='tw') groups=groups.concat(PRESETS.tw);
  if(currentMarket==='all'||currentMarket==='us') groups=groups.concat(PRESETS.us);
  grid.innerHTML=groups.map(function(g){
    return '<label class="preset-group"><input type="checkbox" value="'+g.id+'"><span>'+g.label+'</span></label>';
  }).join('');
}
function toggleFav(symbol){
  var idx=favourites.indexOf(symbol);
  if(idx===-1){favourites.push(symbol);toast('⭐ 已收藏 '+symbol);}
  else{favourites.splice(idx,1);toast('移除收藏 '+symbol);}
  localStorage.setItem('sr_favs',JSON.stringify(favourites));
  renderFavSection();renderCards();
}
function removeFav(sym){
  favourites=favourites.filter(f=>f!==sym);localStorage.setItem('sr_favs',JSON.stringify(favourites));renderFavSection();renderCards();
}
// Auto-detect TW symbols: pure digits 4-6 chars (e.g. 2330, 0050, 00878)
function autoSymbol(s) {
  s = s.trim().toUpperCase();
  if (!s) return '';
  if (s.endsWith('.TW') || s.endsWith('.TWO')) return s;
  // Pure digits 4-6 chars = Taiwan stock
  if (/^\d{4,6}[Bb]?$/.test(s)) return s + '.TW';
  return s;
}

function getSelectedSymbols(){
  const checked=[...document.querySelectorAll('.preset-group input:checked')];
  const fromPresets=checked.flatMap(cb=>{const all=[...PRESETS.tw,...PRESETS.us];const found=all.find(g=>g.id===cb.value);return found?found.syms:[];});
  const fromCustom=document.getElementById('custom-syms').value.split(/[,\s，]+/).map(s=>autoSymbol(s)).filter(Boolean);
  return[...new Set([...fromPresets,...fromCustom])];
}
function applyFilter(){
  const rsiMin=+document.getElementById('f-rsi-min').value||0,rsiMax=+document.getElementById('f-rsi-max').value||100;
  const scoreMin=+document.getElementById('f-score-min').value||0,mkt=document.getElementById('f-market').value;
  displayedResults=allResults.filter(r=>{
    if(r.rsi<rsiMin||r.rsi>rsiMax)return false;if(r.score<scoreMin)return false;
    if(mkt==='tw'&&!r.isTW)return false;if(mkt==='us'&&r.isTW)return false;
    if(favOnlyMode&&!favourites.includes(r.symbol))return false;return true;
  });
  document.getElementById('filter-count').textContent='顯示 '+displayedResults.length+' / '+allResults.length+' 支';renderCards();
}
function toggleFavOnly(){favOnlyMode=!favOnlyMode;document.getElementById('fav-only-btn').classList.toggle('active',favOnlyMode);applyFilter();}
async function startScan(){
  const syms=getSelectedSymbols();if(!syms.length){toast('⚠️ 請勾選清單或輸入代號');return;}
  const btn=document.getElementById('scan-btn');btn.disabled=true;
  document.getElementById('scan-btn-icon').innerHTML='<div class="spinner"></div>';
  document.getElementById('scan-btn-text').textContent='掃描中...';
  document.getElementById('progress-wrap').style.display='block';
  document.getElementById('results-section').style.display='none';
  document.getElementById('empty-state').style.display='none';
  allResults=[];
  for(let i=0;i<syms.length;i++){
    setProgress((i/syms.length)*100,'分析 '+syms[i]+'... ('+(i+1)+'/'+syms.length+')');
    try{const result=await analyzeSymbol(syms[i]);if(result)allResults.push(result);}
    catch(e){console.warn('Failed:',syms[i],e.message);toast('⚠️ '+syms[i]+' 失敗：'+e.message.split('\n')[0]);}
    await sleep(200);
  }
  setProgress(100,'完成！');await sleep(200);
  document.getElementById('progress-wrap').style.display='none';
  document.getElementById('results-section').style.display='block';
  document.getElementById('results-meta').textContent='共分析 '+allResults.length+' 支 · '+new Date().toLocaleTimeString('zh-TW');
  const now=Date.now();
  allResults.forEach(r=>{const prev=scanHistory[r.symbol];scanHistory[r.symbol]={score:r.score,time:now,prev:prev?prev.score:null};});
  localStorage.setItem('sr_history',JSON.stringify(scanHistory));
  sortCards('score',document.querySelector('.sort-btn'));applyFilter();loadAllAI();
  btn.disabled=false;document.getElementById('scan-btn-icon').textContent='🔍';document.getElementById('scan-btn-text').textContent='重新掃描';
}
function setProgress(pct,text){document.getElementById('progress-fill').style.width=pct+'%';document.getElementById('progress-text').textContent=text;}

// ===== TODAY HOT STOCKS =====
async function loadHotStocks(){
  toast('🔥 正在抓取今日熱門股票...');
  var hotSyms=[];
  var proxy='https://corsproxy.io/?url=';
  try{
    var usUrl='https://query1.finance.yahoo.com/v1/finance/trending/US?count=10&useQuotes=true';
    var usResp=await fetch(proxy+encodeURIComponent(usUrl));
    if(usResp.ok){
      var usData=await usResp.json();
      var usSyms=(usData?.finance?.result?.[0]?.quotes||[]).slice(0,7).map(function(q){return q.symbol;});
      hotSyms=hotSyms.concat(usSyms);
    }
  }catch(e){console.warn('US hot failed',e);}
  try{
    var twUrl='https://query1.finance.yahoo.com/v1/finance/trending/TW?count=10&useQuotes=true';
    var twResp=await fetch(proxy+encodeURIComponent(twUrl));
    if(twResp.ok){
      var twData=await twResp.json();
      var twSyms=(twData?.finance?.result?.[0]?.quotes||[]).slice(0,5).map(function(q){return q.symbol;});
      hotSyms=hotSyms.concat(twSyms);
    }
  }catch(e){console.warn('TW hot failed',e);}

  // Fallback: curated high-volume defaults if API fails
  if(!hotSyms.length){
    hotSyms=['NVDA','TSLA','AAPL','AMD','AMZN','META','MSFT','2330.TW','2317.TW','0050.TW'];
    toast('⚠️ 無法取得即時熱門，使用預設清單');
  } else {
    hotSyms=[...new Set(hotSyms)].slice(0,12);
    toast('🔥 已載入 '+hotSyms.length+' 支今日熱門，點擊掃描開始分析');
  }
  document.getElementById('custom-syms').value=hotSyms.join(', ');
}

// ===== PROXY / FETCH =====
const PROXIES=[
  url=>'https://corsproxy.io/?url='+encodeURIComponent(url),
  url=>'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
  url=>'https://corsproxy.org/?'+encodeURIComponent(url),
  url=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url),
];
async function fetchWithTimeout(url,ms,options={}){
  const ctrl=new AbortController();
  const id=setTimeout(()=>ctrl.abort(),ms);
  try{const r=await fetch(url,{signal:ctrl.signal,...options});clearTimeout(id);return r;}
  catch(e){clearTimeout(id);throw e;}
}
async function fetchYahoo(symbol,range='6mo',interval='1d'){
  const targets=[
    'https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(symbol)+'?interval='+interval+'&range='+range+'&includePrePost=false&events=div%2Csplit',
    'https://query2.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(symbol)+'?interval='+interval+'&range='+range+'&includePrePost=false&events=div%2Csplit',
  ];
  const errors=[];
  for(const targetUrl of targets){
    for(const makeProxy of PROXIES){
      const proxyUrl=makeProxy(targetUrl);
      try{
        const resp=await fetchWithTimeout(proxyUrl,12000);
        if(!resp.ok){errors.push('HTTP '+resp.status);continue;}
        const text=await resp.text();
        if(!text||!text.trim()){errors.push('empty');continue;}
        let data;try{data=JSON.parse(text);}catch{errors.push('JSON fail');continue;}
        if(data?.chart?.result?.[0]) return data;
        if(data?.chart?.error) errors.push('Yahoo: '+data.chart.error.description);
      }catch(e){errors.push(e.name+': '+e.message);}
      await sleep(150);
    }
  }
  throw new Error('所有代理均失敗\n'+errors.slice(0,4).join('\n'));
}

// ===== ANALYSIS =====
async function analyzeSymbol(symbol){
  // Check cache first
  const cached=cacheGet(symbol);
  if(cached){
    // Restore history delta
    const h=scanHistory[symbol];
    cached.scoreDelta=h&&h.prev!=null?cached.score-h.prev:null;
    cached.fromCache=true;
    return cached;
  }

  const isTW=symbol.endsWith('.TW')||symbol.endsWith('.TWO');
  const data=await fetchYahoo(symbol,'6mo','1d');
  const result=data?.chart?.result?.[0];
  if(!result) return null;

  const meta=result.meta;
  const closes=result.indicators.quote[0].close.filter(v=>v!=null);
  const highs=result.indicators.quote[0].high?.filter(v=>v!=null)||closes;
  const lows=result.indicators.quote[0].low?.filter(v=>v!=null)||closes;
  const volumes=result.indicators.quote[0].volume?.filter(v=>v!=null)||[];

  if(closes.length<30) return null;

  const price=meta.regularMarketPrice||closes.at(-1);
  const prevClose=meta.chartPreviousClose||closes.at(-2);
  const changePct=prevClose?(price-prevClose)/prevClose:0;
  const currency=meta.currency||(isTW?'TWD':'USD');
  const dp=isTW?1:2;

  const rsi14=calcRSI(closes,14);
  const rsiVal=rsi14.at(-1)||50;
  const macdData=calcMACD(closes);
  const macdHist=macdData.macd.at(-1)-macdData.signal.at(-1);
  const bb=calcBB(closes,20,2);
  const bbU=bb.upper.at(-1),bbM=bb.mid.at(-1),bbL=bb.lower.at(-1);
  const ma20=calcMA(closes,20);
  const ma60=calcMA(closes,60);
  const atr=calcATR(highs,lows,closes,14);
  const atrVal=atr.at(-1)||price*0.02;
  const volAvg20=volumes.length>=20?avg(volumes.slice(-20)):0;
  const volRatio=volAvg20?(volumes.at(-1)||0)/volAvg20:1;

  const recentLows=lows.slice(-20),recentHighs=highs.slice(-20);
  const support1=Math.min(...recentLows),resist1=Math.max(...recentHighs);
  const stopLoss=support1*0.97;

  const buyShortLow=Math.max(bbL||price*0.95,support1);
  const buyShortHigh=ma20||price*0.98;
  const shortEntryNow=price<=buyShortHigh*1.01;
  const targetShort=Math.max(Math.max(resist1,bbU||price*1.05),price+atrVal);

  const buySwingLow=(ma60||price*0.88)*0.98;
  const buySwingHigh=(ma60||price*0.88)*1.01;
  const swingEntryNow=price<=(ma60||price)*1.03;
  const targetSwing=Math.max(resist1+atrVal,price+atrVal*2);

  const risk=price-stopLoss;
  const reward=targetShort-price;
  const rrRatio=risk>0?(reward/risk):0;
  const buyShort=buyShortLow,buySwing=buySwingLow;

  const bbPctRaw=(bbU&&bbL&&bbU!==bbL)?(price-bbL)/(bbU-bbL):0.5;
  const priceVsBuy=buyShort>0?(price-buyShort)/buyShort:0;

  let score=50;
  if(rsiVal<30) score+=18;else if(rsiVal<40) score+=12;else if(rsiVal<50) score+=6;
  else if(rsiVal>75) score-=15;else if(rsiVal>65) score-=8;
  if(macdHist>0) score+=10;else score-=5;
  if(price>ma20) score+=6;else score-=8;
  if(ma60&&price>ma60) score+=6;else if(ma60) score-=5;
  if(bbPctRaw<0.1) score+=12;else if(bbPctRaw<0.25) score+=6;
  else if(bbPctRaw>1.0) score-=20;else if(bbPctRaw>0.85) score-=12;else if(bbPctRaw>0.70) score-=5;
  if(priceVsBuy>0.08) score-=15;else if(priceVsBuy>0.04) score-=7;
  if(volRatio>1.5) score+=4;
  score=Math.max(0,Math.min(100,Math.round(score)));

  const warnings=[];
  if(bbPctRaw>1.0) warnings.push({level:'danger',text:'⚠️ 股價已突破布林上軌，追高風險高，建議等回踩再進場'});
  else if(bbPctRaw>0.85) warnings.push({level:'warn',text:'⚠️ 股價接近布林上軌，上方空間有限，不宜追高'});
  if(rsiVal>70) warnings.push({level:'danger',text:'⚠️ RSI 超買區（>70），短線回調機率上升'});
  else if(rsiVal>65) warnings.push({level:'warn',text:'⚠️ RSI 偏高（>65），動能可能趨緩'});
  if(priceVsBuy>0.08) warnings.push({level:'warn',text:'⚠️ 現價比建議買入點高 '+(priceVsBuy*100).toFixed(0)+'%，風報比不佳'});
  if(rrRatio<1&&rrRatio>=0) warnings.push({level:'warn',text:'⚠️ 風險報酬比 <1x，停損空間大於潛在獲利'});

  const verdict=score>=70?'強烈買入機會':score>=55?'可考慮布局':score>=40?'中性觀察':'偏空，暫緩';
  const verdictColor=score>=70?'#059669':score>=55?'#2563eb':score>=40?'#d97706':'#dc2626';

  const bt=runBacktest(closes,rsi14);

  // History delta
  const h=scanHistory[symbol];
  const scoreDelta=h&&h.prev!=null?score-h.prev:null;

  const obj={
    symbol,isTW,price,changePct,currency,dp,
    name:meta.shortName||meta.longName||symbol,
    rsi:rsiVal,macdHist,bbU,bbM,bbL,ma20,ma60,
    atrVal,volRatio,
    buyShort,buySwing,targetShort,targetSwing,stopLoss,rrRatio,
    buyShortLow,buyShortHigh,buySwingLow,buySwingHigh,shortEntryNow,swingEntryNow,
    score,verdict,verdictColor,warnings,scoreDelta,fromCache:false,
    closes:closes.slice(-60),highs:highs.slice(-60),lows:lows.slice(-60),
    bbUpperArr:bb.upper.slice(-60),bbLowerArr:bb.lower.slice(-60),
    bt,
  };
  cacheSet(symbol,obj);
  return obj;
}

// ===== BACKTEST (upgraded: RSI + MACD + MA60) =====
function runBacktest(closes, rsiArr) {
  const trades = []; let position = null;
  const macdData = calcMACD(closes);
  const ma60Arr = closes.map((_, i) => i >= 59 ? avg(closes.slice(i-59, i+1)) : null);

  for (let i = 1; i < closes.length; i++) {
    const rsi = rsiArr[i]; if (rsi == null) continue;
    const macdHist = macdData.macd[i] - macdData.signal[i];
    const ma60 = ma60Arr[i];
    // Buy: RSI<40 + MACD turning positive + price above MA60 (trend filter)
    const buySignal = rsi < 40 && macdHist > 0 && (!ma60 || closes[i] > ma60 * 0.97);
    // Sell: RSI>60 + MACD turning negative
    const sellSignal = rsi > 60 && macdHist < 0;

    if (!position && buySignal) position = { buyPrice: closes[i] };
    else if (position && sellSignal) {
      const ret = (closes[i] - position.buyPrice) / position.buyPrice;
      trades.push({ buy: position.buyPrice, sell: closes[i], ret, win: ret > 0 });
      position = null;
    }
  }
  if (position) {
    const ret = (closes.at(-1) - position.buyPrice) / position.buyPrice;
    trades.push({ buy: position.buyPrice, sell: closes.at(-1), ret, win: ret > 0, open: true });
  }
  if (!trades.length) return { trades: [], winRate: 0, totalReturn: 0, avgReturn: 0, count: 0 };
  const winRate = trades.filter(t => t.win).length / trades.length;
  const totalReturn = trades.reduce((s, t) => s + t.ret, 0);
  return { trades, winRate, totalReturn, avgReturn: totalReturn / trades.length, count: trades.length };
}

// ===== MINI CHART =====
function drawMiniChart(r){
  const canvas=document.getElementById('mc-'+r.symbol.replace(/\./g,'-'));
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||330,H=60;
  canvas.width=W;canvas.height=H;

  const closes=r.closes,bbU=r.bbUpperArr||[],bbL=r.bbLowerArr||[];
  const all=[...closes,...bbU.filter(v=>v),...bbL.filter(v=>v)];
  const minV=Math.min(...all),maxV=Math.max(...all);
  const yScale=v=>H-((v-minV)/(maxV-minV))*(H-4)-2;
  const xScale=i=>i/(closes.length-1)*W;

  // BB upper
  if(bbU.length&&bbL.length){
    ctx.beginPath();
    bbU.forEach((v,i)=>{if(v){i===0||!bbU[i-1]?ctx.moveTo(xScale(i),yScale(v)):ctx.lineTo(xScale(i),yScale(v));}});
    ctx.strokeStyle='rgba(37,99,235,0.2)';ctx.lineWidth=1;ctx.stroke();
    // BB fill
    ctx.beginPath();
    bbU.forEach((v,i)=>{if(v){i===0||!bbU[i-1]?ctx.moveTo(xScale(i),yScale(v)):ctx.lineTo(xScale(i),yScale(v));}});
    const validL=bbL.map((v,i)=>[i,v]).filter(x=>x[1]);
    for(let i=validL.length-1;i>=0;i--) ctx.lineTo(xScale(validL[i][0]),yScale(validL[i][1]));
    ctx.fillStyle='rgba(37,99,235,0.05)';ctx.fill();
    // BB lower
    ctx.beginPath();
    bbL.forEach((v,i)=>{if(v){i===0||!bbL[i-1]?ctx.moveTo(xScale(i),yScale(v)):ctx.lineTo(xScale(i),yScale(v));}});
    ctx.strokeStyle='rgba(37,99,235,0.2)';ctx.lineWidth=1;ctx.stroke();
  }

  // Price line
  const isUp=closes.at(-1)>=closes[0];
  ctx.beginPath();
  closes.forEach((v,i)=>{i===0?ctx.moveTo(xScale(i),yScale(v)):ctx.lineTo(xScale(i),yScale(v));});
  ctx.strokeStyle=isUp?'#059669':'#dc2626';ctx.lineWidth=1.5;ctx.stroke();

  // Current price dot
  const lastX=xScale(closes.length-1),lastY=yScale(closes.at(-1));
  ctx.beginPath();ctx.arc(lastX,lastY,3,0,Math.PI*2);
  ctx.fillStyle=isUp?'#059669':'#dc2626';ctx.fill();
}

// ===== SAFETY RATING =====
function calcSafety(r) {
  // 五個維度各自評估，累計扣分
  var issues = 0;
  var blockers = 0; // 嚴重問題直接降級

  // 1. 風報比
  if (r.rrRatio >= 2.5)      {} // 優秀
  else if (r.rrRatio >= 1.5) issues += 1;
  else if (r.rrRatio >= 1)   issues += 2;
  else                        blockers += 1; // 風報比 <1 直接扣大分

  // 2. 評分
  if (r.score >= 60)      {} // 良好
  else if (r.score >= 45) issues += 1;
  else if (r.score >= 35) issues += 2;
  else                    blockers += 1;

  // 3. 警示數量
  var dangerCount = (r.warnings||[]).filter(function(w){return w.level==='danger';}).length;
  var warnCount   = (r.warnings||[]).filter(function(w){return w.level==='warn';}).length;
  blockers += dangerCount;
  issues   += warnCount;

  // 4. 是否在買入區（現在進場合不合理）
  if (!r.shortEntryNow && !r.swingEntryNow) issues += 1;

  // 5. 布林位置
  var bbPctRaw = (r.bbU && r.bbL && r.bbU !== r.bbL) ? (r.price - r.bbL) / (r.bbU - r.bbL) : 0.5;
  if (bbPctRaw > 1.0)       blockers += 1;
  else if (bbPctRaw > 0.85) issues   += 1;
  else if (bbPctRaw < 0.25) issues   -= 1; // 接近下軌是加分

  // 計算等級
  var total = blockers * 2 + issues;
  if (blockers >= 2 || total >= 5) {
    return { level: 1, tag: '⚠️ 高風險', color: '#dc2626', bg: 'rgba(220,38,38,0.08)', border: 'rgba(220,38,38,0.2)', stars: 1, desc: '多項風險指標亮燈，不建議現在進場' };
  } else if (blockers === 1 || total >= 3) {
    return { level: 2, tag: '🟡 中等風險', color: '#d97706', bg: 'rgba(217,119,6,0.08)', border: 'rgba(217,119,6,0.2)', stars: 2, desc: '有一定風險，需謹慎評估後再進場' };
  } else if (total >= 1) {
    return { level: 3, tag: '🔵 尚可', color: '#2563eb', bg: 'rgba(37,99,235,0.07)', border: 'rgba(37,99,235,0.2)', stars: 3, desc: '結構尚可，留意小型風險後可考慮布局' };
  } else if (total <= 0 && r.rrRatio >= 2) {
    return { level: 5, tag: '✅ 低風險', color: '#059669', bg: 'rgba(5,150,105,0.08)', border: 'rgba(5,150,105,0.2)', stars: 5, desc: '風報比佳、無警示、評分良好，進場結構健康' };
  } else {
    return { level: 4, tag: '🟢 較低風險', color: '#059669', bg: 'rgba(5,150,105,0.06)', border: 'rgba(5,150,105,0.18)', stars: 4, desc: '進場條件良好，風報比和指標均屬正常' };
  }
}

function buildSafetyBar(r) {
  var s = calcSafety(r);
  var stars = '';
  for (var i = 1; i <= 5; i++) {
    var filled = i <= s.stars;
    stars += '<div class="safety-star" style="background:' + (filled ? s.color : 'var(--line)') + ';opacity:' + (filled ? '1' : '0.3') + '"></div>';
  }
  return '<div class="safety-bar" style="background:' + s.bg + ';border-bottom:1px solid ' + s.border + '">' +
    '<span class="safety-label">安全評級</span>' +
    '<div class="safety-stars">' + stars + '</div>' +
    '<span class="safety-tag" style="color:' + s.color + ';background:' + s.bg + ';border:1px solid ' + s.border + '">' + s.tag + '</span>' +
    '<span class="safety-desc">' + s.desc + '</span>' +
  '</div>';
}

function buildCard(r,idx){

  const cCls=r.changePct>=0?'c-bull':'c-bear';
  const mktB=r.isTW?'<span class="mkt-badge mkt-tw">台股</span>':'<span class="mkt-badge mkt-us">美股</span>';
  const sym=r.symbol.replace('.TW','').replace('.TWO','');
  const isFav=favourites.includes(r.symbol);
  const isEntry=r.shortEntryNow||r.swingEntryNow;

  const rsiSig=r.rsi<30?'🟢 超賣':r.rsi<45?'🟡 偏低':r.rsi<55?'⚪ 中性':r.rsi<70?'🟡 偏高':'🔴 超買';
  const rsiCls=r.rsi<45?'c-bull':r.rsi>65?'c-bear':'c-neu';
  const macdSig=r.macdHist>0?'🟢 多頭':'🔴 空頭';
  const macdCls=r.macdHist>0?'c-bull':'c-bear';
  const bbPct=(r.bbU&&r.bbL&&r.bbU!==r.bbL)?((r.price-r.bbL)/(r.bbU-r.bbL)*100).toFixed(0):50;
  const bbSig=bbPct<20?'🟢 近下軌':bbPct>80?'🔴 近上軌':'⚪ 中性';
  const bbCls=bbPct<20?'c-bull':bbPct>80?'c-bear':'c-neu';

  const C=2*Math.PI*16;
  const scoreDash=(r.score/100)*C;

  let rrClass='rr-bad',rrText='風報比差';
  if(r.rrRatio>=2){rrClass='rr-good';rrText='風報比 '+r.rrRatio.toFixed(1)+'x ✓';}
  else if(r.rrRatio>=1){rrClass='rr-ok';rrText='風報比 '+r.rrRatio.toFixed(1)+'x';}
  else{rrText='風報比 '+r.rrRatio.toFixed(1)+'x';}

  // Score delta badge
  let deltaBadge='';
  if(r.scoreDelta!=null&&r.scoreDelta!==0){
    const up=r.scoreDelta>0;
    deltaBadge='<span style="font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px;font-weight:600;background:'+(up?'rgba(5,150,105,0.1)':'rgba(220,38,38,0.08)')+';color:'+(up?'#065f46':'#991b1b')+'">'+(up?'↑+':'↓')+r.scoreDelta+'</span>';
  }
  const cacheLabel=r.fromCache?'<span class="cache-badge">快取</span>':'';

  const bt=r.bt;
  const btColor=bt.totalReturn>=0?'#059669':'#dc2626';
  const btBlock=bt.count>0?
    '<div class="bt-stats">'+
      '<div class="bt-stat"><div class="bt-stat-val" style="color:'+btColor+'">'+(bt.totalReturn*100).toFixed(1)+'%</div><div class="bt-stat-lbl">總報酬</div></div>'+
      '<div class="bt-stat"><div class="bt-stat-val">'+(bt.winRate*100).toFixed(0)+'%</div><div class="bt-stat-lbl">勝率</div></div>'+
      '<div class="bt-stat"><div class="bt-stat-val" style="color:'+(bt.avgReturn>=0?'#059669':'#dc2626')+'">'+(bt.avgReturn*100).toFixed(1)+'%</div><div class="bt-stat-lbl">均報酬</div></div>'+
      '<div class="bt-stat"><div class="bt-stat-val">'+bt.count+'</div><div class="bt-stat-lbl">交易次數</div></div>'+
    '</div>'+
    '<div class="bt-detail" id="btd-'+r.symbol.replace(/\./g,'-')+'">'+
      bt.trades.map(function(t,i){
        return '<div class="bt-trade-row"><span>#'+(i+1)+' '+(t.open?'(持倉中)':'')+'</span><span>'+t.buy.toFixed(r.dp)+' → '+t.sell.toFixed(r.dp)+'</span><span class="'+(t.win?'bt-win':'bt-loss')+'">'+(t.ret>=0?'+':'')+(t.ret*100).toFixed(1)+'%</span></div>';
      }).join('')+
    '</div>'
    :'<div style="font-size:11px;color:var(--text3)">回測期間無符合 RSI 訊號的交易</div>';

  return '<div class="stock-card'+(isFav?' fav-card':'')+(isEntry?' entry-ready':'')+'" style="animation-delay:'+( idx*0.04)+'s" id="card-'+r.symbol.replace(/\./g,'-')+'">' +

    '<div class="card-head">' +
      '<div class="card-head-left">' +
        '<button class="fav-btn" onclick="toggleFav(\''+r.symbol+'\')">'+(isFav?'⭐':'☆')+'</button>' +
        '<div><div class="card-symbol">'+sym+mktB+cacheLabel+'</div><div class="card-name">'+r.name+'</div></div>' +
      '</div>' +
      '<div class="card-price-wrap">' +
        '<div class="card-price">'+(r.isTW?'':'$')+pFmt+'</div>' +
        '<div class="card-change '+cCls+'">'+cs+(r.changePct*100).toFixed(2)+'%</div>' +
      '</div>' +
    '</div>' +

    '<div class="mini-chart-wrap"><canvas id="mc-'+r.symbol.replace(/\./g,'-')+'" height="60"></canvas></div>' +

    buildSafetyBar(r) +

    '<div class="score-section">' +
      '<div class="score-ring">' +
        '<svg width="48" height="48" viewBox="0 0 48 48">' +
          '<circle cx="24" cy="24" r="16" fill="none" stroke="var(--line)" stroke-width="5"/>' +
          '<circle cx="24" cy="24" r="16" fill="none" stroke="'+r.verdictColor+'" stroke-width="5" stroke-dasharray="'+scoreDash.toFixed(1)+' '+C.toFixed(1)+'" stroke-linecap="round"/>' +
        '</svg>' +
        '<div class="score-ring-val" style="color:'+r.verdictColor+'">'+r.score+'</div>' +
      '</div>' +
      '<div class="score-desc">' +
        '<div class="score-label">綜合評分'+deltaBadge+'</div>' +
        '<div class="score-verdict" style="color:'+r.verdictColor+'">'+r.verdict+'</div>' +
        '<div style="font-size:10px;color:var(--text3);margin-top:2px">ATR: '+r.atrVal.toFixed(r.dp)+' · 量比: '+r.volRatio.toFixed(1)+'x</div>' +
      '</div>' +
    '</div>' +

    '<div class="indicators">' +
      '<div class="ind"><div class="ind-label">RSI(14)</div><div class="ind-val '+rsiCls+'">'+r.rsi.toFixed(1)+'</div><div class="ind-sig '+rsiCls+'">'+rsiSig+'</div></div>' +

      '<div class="ind"><div class="ind-label">布林位置</div><div class="ind-val '+bbCls+'">'+bbPct+'%</div><div class="ind-sig '+bbCls+'">'+bbSig+'</div></div>' +
    '</div>' +

    buildWarnings(r) +
    buildSignals(r,rrClass,rrText) +

    '<div class="backtest-section">' +
      '<div class="backtest-title"><span>🧪 回測（RSI+MACD+MA60 多指標，6個月）</span>'+(bt.count>0?'<button class="backtest-toggle" onclick="toggleBtDetail(\''+r.symbol.replace(/\./g,'-')+'\',this)">展開明細</button>':'')+'</div>'+
      btBlock+
    '</div>' +

    buildDecisionBanner(r) +

  '</div>';
}

function buildWarnings(r){
  if(!r.warnings||!r.warnings.length) return '';
  return '<div class="warn-block">'+r.warnings.map(function(w){return '<div class="warn-item '+w.level+'">'+w.text+'</div>';}).join('')+'</div>';
}
function buildSignals(r,rrClass,rrText){
  var dp=r.dp;
  function pct(a,b){return ((a-b)/b*100).toFixed(1);}
  var shortTitle,shortBuyBox;
  if(r.shortEntryNow){
    shortTitle='⚡ 短線（週內）— <span class="entry-ok">目前可進場</span>';
    shortBuyBox='<div class="signal-box buy"><div class="signal-box-label">🟢 買入區</div><div class="signal-price">'+r.buyShortLow.toFixed(dp)+' ~ '+r.buyShortHigh.toFixed(dp)+'</div><div class="signal-sub">現價在買入區內</div></div>';
  }else{
    var nd=Math.abs(pct(r.buyShortLow,r.price));
    shortTitle='⏳ 短線（週內）— <span class="entry-wait">等待回調 '+nd+'%</span>';
    shortBuyBox='<div class="signal-box wait"><div class="signal-box-label">📍 等待買入區</div><div class="signal-price">'+r.buyShortLow.toFixed(dp)+' ~ '+r.buyShortHigh.toFixed(dp)+'</div><div class="signal-sub">回調 '+nd+'% 後進場</div></div>';
  }
  var sPctT=pct(r.targetShort,r.price);

  var swingTitle,swingBuyBox;
  if(r.swingEntryNow){
    swingTitle='📈 波段（數週~數月）— <span class="entry-ok">可分批布局</span>';
    swingBuyBox='<div class="signal-box buy" style="background:rgba(37,99,235,0.06);border-color:rgba(37,99,235,0.2)"><div class="signal-box-label" style="color:#1e40af">🔵 買入區</div><div class="signal-price" style="color:#2563eb">'+r.buySwingLow.toFixed(dp)+' ~ '+r.buySwingHigh.toFixed(dp)+'</div><div class="signal-sub">MA60 支撐附近</div></div>';
  }else{
    var nd2=Math.abs(pct(r.buySwingLow,r.price));
    swingTitle='📈 波段（數週~數月）— <span class="entry-wait">等待回調至 MA60</span>';
    swingBuyBox='<div class="signal-box wait"><div class="signal-box-label">📍 等待買入區</div><div class="signal-price">'+r.buySwingLow.toFixed(dp)+' ~ '+r.buySwingHigh.toFixed(dp)+'</div><div class="signal-sub">需回調 '+nd2+'%（MA60 支撐）</div></div>';
  }
  var swPctT=pct(r.targetSwing,r.price);
  var swingBlock='<div class="signal-section" style="margin-top:6px"><div class="signal-section-title">'+swingTitle+'</div><div class="signal-grid-3">'+swingBuyBox+'<div class="signal-box target"><div class="signal-box-label">🚀 目標價</div><div class="signal-price">'+r.targetSwing.toFixed(dp)+'</div><div class="signal-sub">潛在 +'+swPctT+'%（進場後）</div></div><div class="signal-box stop"><div class="signal-box-label">🛑 停損</div><div class="signal-price">'+r.stopLoss.toFixed(dp)+'</div><div class="signal-sub">跌破出場</div></div></div></div>';

  var rrRow='<div style="display:flex;align-items:center;justify-content:flex-end;margin-top:6px;gap:6px"><div class="rr-badge '+rrClass+'">'+rrText+'</div><div style="font-size:9px;color:var(--text3)">從現價計算</div></div>';

// ===== INDICATORS =====
function avg(arr){return arr.length?arr.reduce((s,v)=>s+v,0)/arr.length:0;}
function calcMA(closes,period){return closes.length<period?null:avg(closes.slice(-period));}
function calcRSI(closes,period=14){
  const rsi=new Array(closes.length).fill(null);
  if(closes.length<=period) return rsi;
  let gains=0,losses=0;
  for(let i=1;i<=period;i++){const d=closes[i]-closes[i-1];d>0?gains+=d:losses-=d;}
  let ag=gains/period,al=losses/period;
  rsi[period]=100-100/(1+ag/(al||1e-9));
  for(let i=period+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    ag=(ag*(period-1)+Math.max(d,0))/period;al=(al*(period-1)+Math.max(-d,0))/period;
    rsi[i]=100-100/(1+ag/(al||1e-9));
  }
  return rsi;
}
function calcEMA(arr,period){const k=2/(period+1),result=[arr[0]];for(let i=1;i<arr.length;i++) result.push(arr[i]*k+result[i-1]*(1-k));return result;}
function calcMACD(closes){const fast=calcEMA(closes,12),slow=calcEMA(closes,26),macd=fast.map((v,i)=>v-slow[i]);return{macd,signal:calcEMA(macd,9)};}
function calcBB(closes,period=20,mult=2){
  const mid=[],upper=[],lower=[];
  for(let i=0;i<closes.length;i++){
    if(i<period-1){mid.push(null);upper.push(null);lower.push(null);continue;}
    const sl=closes.slice(i-period+1,i+1),m=avg(sl);
    const std=Math.sqrt(sl.reduce((s,v)=>s+(v-m)**2,0)/period);
    mid.push(m);upper.push(m+mult*std);lower.push(m-mult*std);
  }
  return{mid,upper,lower};
}
function calcATR(highs,lows,closes,period=14){
  const tr=highs.map((h,i)=>i===0?h-lows[i]:Math.max(h-lows[i],Math.abs(h-closes[i-1]),Math.abs(lows[i]-closes[i-1])));
  const atr=[tr[0]];
  for(let i=1;i<tr.length;i++) atr.push((atr[i-1]*(period-1)+tr[i])/period);
  return atr;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}

// ===== DECISION BANNER =====
function buildDecisionBanner(r) {
  const d = calcDecision(r);
  return '<div class="decision-banner" style="background:' + d.bg + ';border-top:2px solid ' + d.color + '">' +
    '<div class="decision-icon">' + d.icon + '</div>' +
    '<div class="decision-text">' +
      '<div class="decision-action" style="color:' + d.color + '">' + d.action + '</div>' +
      '<div class="decision-reason">' + d.reason + '</div>' +
    '</div>' +
  '</div>';
}

function calcDecision(r) {
  const bbPct = (r.bbU && r.bbL && r.bbU !== r.bbL) ? (r.price - r.bbL) / (r.bbU - r.bbL) : 0.5;
  const dangerCount = (r.warnings||[]).filter(w => w.level==='danger').length;

  // SELL signals
  if (r.rsi > 70 && r.macdHist < 0 && bbPct > 0.8)
    return { action:'🔴 建議賣出', icon:'🔴', color:'#dc2626', bg:'rgba(220,38,38,0.05)',
      reason:'RSI 超買（'+r.rsi.toFixed(0)+'）+ MACD 轉空 + 接近布林上軌，短線回調風險高，建議考慮獲利了結或減倉。' };
  if (r.score < 38 || dangerCount >= 2)
    return { action:'🔴 建議觀望或賣出', icon:'🔴', color:'#dc2626', bg:'rgba(220,38,38,0.05)',
      reason:'綜合評分偏低（'+r.score+'分），多項風險警示亮燈，不建議現在進場或持有。' };

  // BUY signals
  if (r.rsi < 35 && r.macdHist > 0 && r.score >= 60)
    return { action:'🟢 強烈建議買入', icon:'🟢', color:'#059669', bg:'rgba(5,150,105,0.05)',
      reason:'RSI 超賣（'+r.rsi.toFixed(0)+'）+ MACD 轉多 + 綜合評分 '+r.score+' 分，技術面出現明確反彈訊號，短線進場機會良好。' };
  if (r.score >= 65 && r.rrRatio >= 2 && dangerCount === 0)
    return { action:'🟢 建議買入', icon:'🟢', color:'#059669', bg:'rgba(5,150,105,0.05)',
      reason:'評分 '+r.score+' 分、風報比 '+r.rrRatio.toFixed(1)+'x，技術結構健康，可考慮分批進場布局。' };
  if (r.score >= 55 && r.shortEntryNow && dangerCount === 0)
    return { action:'🟢 可考慮買入', icon:'🟡', color:'#2563eb', bg:'rgba(37,99,235,0.04)',
      reason:'現價在短線買入區內，評分 '+r.score+' 分，技術面尚可，可小倉試單，注意停損 '+r.stopLoss.toFixed(r.dp)+'。' };

  // HOLD / WAIT
  if (r.rsi > 55 && bbPct > 0.6 && !r.shortEntryNow)
    return { action:'🟡 等待回調', icon:'🟡', color:'#d97706', bg:'rgba(217,119,6,0.04)',
      reason:'現價高於建議買入區，RSI '+r.rsi.toFixed(0)+'，建議等待回調至 '+r.buyShortLow.toFixed(r.dp)+' ~ '+r.buyShortHigh.toFixed(r.dp)+' 再進場。' };

  return { action:'🟡 觀望', icon:'🟡', color:'#d97706', bg:'rgba(217,119,6,0.04)',
    reason:'目前訊號不夠明確（評分 '+r.score+' 分，RSI '+r.rsi.toFixed(0)+'），建議持續觀察，等待更清晰的進出場訊號。' };
}

function addPosition(market) {
  const symEl = document.getElementById(market+'-sym');
  const costEl = document.getElementById(market+'-cost');
  const qtyEl = document.getElementById(market+'-qty');
  const brokerEl = document.getElementById(market==='us' ? 'us-broker' : 'tw-broker-input');
  const sym = symEl.value.trim().toUpperCase();
  const cost = parseFloat(costEl.value);
  const qty = parseFloat(qtyEl.value);
  const broker = brokerEl.value.trim();
  if (!sym || !cost || !qty) { toast('⚠️ 請填入代號、成本和股數'); return; }
  const fullSym = market === 'tw' ? autoSymbol(sym) : sym;
  const displaySym = fullSym.replace('.TW','').replace('.TWO','');

  // Check if same symbol + same broker already exists → merge with weighted avg cost
  const existing = portfolio[market].find(p => p.sym === fullSym && p.broker === broker);
  if (existing) {
    const totalQty = existing.qty + qty;
    const weightedCost = (existing.cost * existing.qty + cost * qty) / totalQty;
    existing.qty = parseFloat(totalQty.toFixed(4));
    existing.cost = parseFloat(weightedCost.toFixed(4));
    const idx = portfolio[market].indexOf(existing);
    savePortfolio();
    symEl.value = ''; costEl.value = ''; qtyEl.value = '';
    renderPortfolio();
    toast('🔀 已合併 ' + displaySym + '｜新均價 ' + weightedCost.toFixed(2) + '，共 ' + totalQty + ' 股');
    fetchPortfolioPrice(market, idx);
    return;
  }

  portfolio[market].push({ sym: fullSym, displaySym, cost, qty, broker, name: '', price: null, lastUpdate: null });
  savePortfolio();
  symEl.value = ''; costEl.value = ''; qtyEl.value = '';
  renderPortfolio();
  toast('✅ 已新增 ' + displaySym + '，正在抓取現價...');
  fetchPortfolioPrice(market, portfolio[market].length - 1);
}

function removePosition(market, idx) {
  portfolio[market].splice(idx, 1);
  savePortfolio();
  renderPortfolio();
}

async function fetchPortfolioPrice(market, idx) {
  const pos = portfolio[market][idx];
  if (!pos) return;
  try {
    const data = await fetchYahoo(pos.sym, '6mo', '1d');
    const result = data?.chart?.result?.[0];
    if (!result) return;
    const meta = result.meta;
    const closes = result.indicators.quote[0].close.filter(v => v != null);
    const highs = result.indicators.quote[0].high?.filter(v => v != null) || closes;
    const lows = result.indicators.quote[0].low?.filter(v => v != null) || closes;
    pos.price = meta.regularMarketPrice || closes.at(-1);
    pos.name = meta.shortName || meta.longName || pos.sym;
    pos.lastUpdate = new Date().toLocaleTimeString('zh-TW');

    // Calculate health indicators for sell suggestion and health check
    const rsiArr = calcRSI(closes, 14);
    const rsi = rsiArr.at(-1) || 50;
    const macdData = calcMACD(closes);
    const macdHist = macdData.macd.at(-1) - macdData.signal.at(-1);
    const bb = calcBB(closes, 20, 2);
    const bbU = bb.upper.at(-1), bbL = bb.lower.at(-1), bbM = bb.mid.at(-1);
    const ma20 = calcMA(closes, 20);
    const ma60 = calcMA(closes, 60);
    const atr = calcATR(highs, lows, closes, 14);
    const atrVal = atr.at(-1) || pos.price * 0.02;
    const recentHighs = highs.slice(-20);
    const resist = Math.max(...recentHighs);
    const dp = market === 'tw' ? 1 : 2;

    // Sell suggestion: target price
    var rawTarget = Math.max(resist, bbU || pos.price * 1.05, pos.price + atrVal);
    // Ensure target is always above current price
    if (rawTarget <= pos.price) rawTarget = pos.price + atrVal * 1.5;
    pos.sellTarget = rawTarget.toFixed(dp);
    var rawStop = Math.min(...lows.slice(-20)) * 0.97;
    // Ensure stop is always below current price
    if (rawStop >= pos.price) rawStop = pos.price * 0.95;
    pos.sellStop = rawStop.toFixed(dp);

    // Health decision
    const bbPct = (bbU && bbL && bbU !== bbL) ? (pos.price - bbL) / (bbU - bbL) : 0.5;
    let score = 50;
    if (rsi < 30) score += 18; else if (rsi < 40) score += 12; else if (rsi < 50) score += 6;
    else if (rsi > 75) score -= 15; else if (rsi > 65) score -= 8;
    if (macdHist > 0) score += 10; else score -= 5;
    if (pos.price > ma20) score += 6; else score -= 8;
    if (ma60 && pos.price > ma60) score += 6; else if (ma60) score -= 5;
    if (bbPct < 0.1) score += 12; else if (bbPct > 0.85) score -= 12;
    score = Math.max(0, Math.min(100, Math.round(score)));

    let health;
    if (rsi > 70 && macdHist < 0) health = { cls: 'health-sell', label: '🔴 建議賣出', tip: 'RSI超買+MACD轉空' };
    else if (score < 38) health = { cls: 'health-sell', label: '🔴 考慮減倉', tip: '技術面偏弱' };
    else if (score >= 65 && rsi < 50) health = { cls: 'health-buy', label: '🟢 持有加碼', tip: '技術面良好' };
    else if (score >= 50) health = { cls: 'health-hold', label: '🔵 繼續持有', tip: '結構尚可' };
    else health = { cls: 'health-watch', label: '🟡 注意觀察', tip: '訊號混合' };
    pos.health = health;

    savePortfolio();
    renderPortfolio();
  } catch(e) { console.warn('Portfolio price fetch failed:', pos.sym, e.message); }
}

    await sleep(400);
  }

}

function renderPortfolioTable(market) {
  var wrap = document.getElementById(market + '-port-cards');
  if (!wrap) return;
  var positions = portfolio[market];
  if (!positions.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px">尚無'+(market==='us'?'美股':'台股')+'持倉，點擊「＋ 新增」加入</div>';
    return;
  }
  var dp = market === 'tw' ? 1 : 2;
  var cur = market === 'us' ? '$' : '';
  wrap.innerHTML = '<div class="port-cards-wrap">' + positions.map(function(p, i) {
    var hasPrice = p.price != null;
    var invested = p.cost * p.qty;
    var value = hasPrice ? p.price * p.qty : null;
    var pnl = hasPrice ? value - invested : null;
    var pnlPct = hasPrice ? (pnl / invested) * 100 : null;
    var pnlColor = pnl > 0 ? '#059669' : pnl < 0 ? '#dc2626' : 'var(--text2)';
    var cardCls = pnl > 0 ? 'pos-gain' : pnl < 0 ? 'pos-loss' : 'pos-flat';
    var health = p.health || { cls: 'health-watch', label: '⏳ 待更新', tip: '' };
    var pnlStr = pnl != null ? (pnl>=0?'+':'') + cur + pnl.toFixed(dp) : '⏳';
    var pnlPctStr = pnlPct != null ? (pnlPct>=0?'+':'') + pnlPct.toFixed(2) + '%' : '';
    var hasSell = p.sellTarget && parseFloat(p.sellTarget) > 0;
    var sellStr = hasSell
      ? '<span style="color:#059669;font-size:11px;font-weight:700;font-family:monospace">▲ '+cur+p.sellTarget+'</span>　<span style="color:#dc2626;font-size:11px;font-weight:600">▼ 止損 '+cur+p.sellStop+'</span>'
      : '<span style="color:var(--text3);font-size:11px">⏳ 待更新報價</span>';
    return '<div class="pos-card ' + cardCls + '">' +
      '<div class="pos-top">' +
        '<div><div class="pos-sym">' + p.displaySym +
          (p.broker ? ' <span style="font-size:10px;font-weight:400;color:var(--text3)">'+p.broker+'</span>' : '') +
        '</div><div class="pos-name">' + (p.name||'') + '</div></div>' +
        '<div style="text-align:right">' +
          '<div class="pos-pnl-main" style="color:'+pnlColor+'">' + pnlStr + '</div>' +
          '<div style="font-size:11px;color:'+pnlColor+';font-weight:600;font-family:monospace">' + pnlPctStr + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="pos-row"><div class="pos-row-label">成本</div><div class="pos-row-val">'+cur+p.cost.toFixed(dp)+'</div></div>' +
      '<div class="pos-row"><div class="pos-row-label">現價</div><div class="pos-row-val" style="color:'+pnlColor+'">'+(hasPrice?cur+p.price.toFixed(dp):'⏳')+'</div></div>' +
      '<div class="pos-row"><div class="pos-row-label">股數/張</div><div class="pos-row-val">'+p.qty+'</div></div>' +
      '<div class="pos-row"><div class="pos-row-label">市值</div><div class="pos-row-val">'+(value!=null?cur+value.toFixed(0):'-')+'</div></div>' +
      '<div class="pos-bottom">' +
        '<div>' + sellStr + '</div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<span class="health-badge ' + health.cls + '">' + health.label + '</span>' +
          '<button style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:0" data-mkt="'+market+'" data-idx="'+i+'" onclick="this.closest(\'[data-mkt]\') || removePosition(this.dataset.mkt, +this.dataset.idx)">🗑</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

function renderPortfolioSummary() {
  const usPos = portfolio.us.filter(p => p.price != null);
  const twPos = portfolio.tw.filter(p => p.price != null);
  const usInvested = portfolio.us.reduce((s, p) => s + p.cost * p.qty, 0);
  const usValue = usPos.reduce((s, p) => s + p.price * p.qty, 0);
  const twInvested = portfolio.tw.reduce((s, p) => s + p.cost * p.qty, 0);
  const twValue = twPos.reduce((s, p) => s + p.price * p.qty, 0);
  const usdTwd = 32;
  const totalInvTWD = twInvested + usInvested * usdTwd;
  const totalValTWD = twValue + usValue * usdTwd;
  const totalPnl = totalValTWD - totalInvTWD;
  const pnlColor = totalPnl >= 0 ? '#059669' : '#dc2626';

  document.getElementById('port-summary').innerHTML =
    '<div class="port-sum-card"><div class="port-sum-label">總市值(TWD)</div><div class="port-sum-val">' + (totalValTWD/10000).toFixed(1) + '<span style="font-size:13px">萬</span></div><div class="port-sum-sub">投入 ' + (totalInvTWD/10000).toFixed(1) + ' 萬</div></div>' +
    '<div class="port-sum-card"><div class="port-sum-label">總損益(TWD)</div><div class="port-sum-val" style="color:' + pnlColor + '">' + (totalPnl>=0?'+':'') + (totalPnl/10000).toFixed(1) + '<span style="font-size:13px">萬</span></div><div class="port-sum-sub">' + (totalInvTWD?(totalPnl/totalInvTWD*100).toFixed(2):'0') + '%</div></div>' +
    '<div class="port-sum-card"><div class="port-sum-label">美股市值</div><div class="port-sum-val">$' + usValue.toFixed(0) + '</div><div class="port-sum-sub">' + portfolio.us.length + ' 支</div></div>' +
    '<div class="port-sum-card"><div class="port-sum-label">台股市值</div><div class="port-sum-val">' + (twValue/10000).toFixed(1) + '<span style="font-size:13px">萬</span></div><div class="port-sum-sub">' + portfolio.tw.length + ' 支</div></div>';
}
