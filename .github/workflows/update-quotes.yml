name: Update quotes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: stockradar-quotes
  cancel-in-progress: true

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch quotes
        run: node update-quotes.mjs

      - name: Save quote snapshot
        run: |
          if git diff --quiet -- quotes.json; then
            echo "No quote changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -m "chore: update market quotes"
          git push
